# Déploiement sur Netlify
#
# Le site tourne aussi bien sur Netlify que sur Vercel : Netlify fournit un
# environnement d'exécution Next.js qui prend en charge le routeur App, les
# actions serveur, le middleware et les routes d'API.
#
# Trois points demandent malgré tout une configuration explicite, détaillés
# dans le README à la section « Déploiement sur Netlify » :
#
#   1. le stockage des médias doit passer par S3 (Cloudflare R2, Supabase
#      Storage…) — le disque des fonctions est en lecture seule ;
#   2. la base PostgreSQL doit être jointe par une connexion mutualisée,
#      sans quoi les fonctions épuisent le pool de connexions ;
#   3. l'hébergeur annoncé dans les mentions légales doit être corrigé.

[build]
  # « build:deploiement » applique d'abord les migrations, puis lance
  # « npm run build » (qui régénère le client Prisma — il n'est pas
  # versionné — avant de construire le site).
  #
  # Les migrations tournent ici parce que c'est le seul endroit qui joigne
  # à la fois le dépôt et la base. Prisma pose un verrou avant d'appliquer
  # une migration : deux déploiements simultanés attendent leur tour au
  # lieu de se marcher dessus. Surveillez malgré tout le journal du
  # premier déploiement, une migration interrompue se reprend à la main.
  command = "npm run build:deploiement"
  publish = ".next"

[build.environment]
  # Le projet exige Node 20.9 ou plus récent.
  NODE_VERSION = "20"

  # Netlify inspecte le résultat du build et échoue s'il y retrouve la
  # valeur d'une variable d'environnement. Les variables préfixées
  # NEXT_PUBLIC_ sont destinées au navigateur : leur présence dans le
  # paquet est normale et voulue.
  #
  # Cette liste ne doit contenir QUE des variables publiques. N'y ajoutez
  # jamais une clé secrète pour faire passer un build : ce serait
  # désactiver l'alerte au lieu de traiter la fuite.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,NEXT_PUBLIC_PAYPAL_CLIENT_ID,NEXT_PUBLIC_MEDIA_BASE_URL"

  # Pour peupler la base la première fois — catégories, barème de
  # l'atelier, textes, produits de démonstration — ajoutez la variable
  # SEED_ON_DEPLOY = 1 puis relancez un déploiement. Retirez-la ensuite :
  # sans quoi un produit supprimé depuis l'administration reviendrait à
  # chaque mise en ligne.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Les en-têtes de sécurité (CSP, HSTS, X-Frame-Options…) sont définis dans
# next.config.mjs et appliqués par Next lui-même : ne pas les redéclarer
# ici, deux jeux d'en-têtes concurrents produiraient un comportement
# imprévisible selon la route.
